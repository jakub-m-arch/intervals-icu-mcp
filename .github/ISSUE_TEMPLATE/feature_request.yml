name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What do you want to ask your AI assistant, or what do you want it to do?
      placeholder: '"Compare my 5k pace over the last 3 months"'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. Tool or behaviour you have in mind, and relevant Intervals.icu API endpoints.
