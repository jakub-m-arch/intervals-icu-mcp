name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste your API key or private training data.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool name
      description: The MCP tool involved, if any (e.g. `list_activities`).
  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Desktop 1.x, Claude Code, Cursor
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Redact anything sensitive.
      render: text
