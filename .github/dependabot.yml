version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node must match the minimum supported Node version (engines: >=22.12).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript majors are adopted deliberately (tooling such as openapi-typescript
      # relies on the compiler API).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
