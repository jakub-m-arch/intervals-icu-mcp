name: API spec drift

# Downloads the latest Intervals.icu OpenAPI spec every week. If it changed, opens a PR with
# the new snapshot and regenerated types, so CI (typecheck + tests) shows the impact.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download spec and regenerate types
        run: npm run openapi:update
      - name: Regenerate docs
        run: npm run docs:generate
      - name: Check impact
        id: impact
        continue-on-error: true
        run: npm run typecheck && npm test
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/openapi-spec-update
          delete-branch: true
          commit-message: 'chore(api): update Intervals.icu OpenAPI spec'
          title: 'chore(api): update Intervals.icu OpenAPI spec'
          labels: api-spec
          body: |
            The weekly check found changes in the Intervals.icu OpenAPI spec.

            - Snapshot: `openapi/intervals-icu.openapi.json`
            - Regenerated: `src/api/schema.d.ts`, `src/api/endpoints.generated.ts`, `docs/`
            - Typecheck + tests on the new spec: **${{ steps.impact.outcome }}**

            Review the diff for new or changed endpoints. New operations show up as
            "⏳ planned" in `docs/coverage.md` until they get a tool or an exclusion reason.

            🤖 Generated by the `spec-drift` workflow.
